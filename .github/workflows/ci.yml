name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Lint, Typecheck, Migrate, Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paisaproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/paisaproof_test
      VERIFIER_POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/paisaproof_test
      APP_ENV: test
      PYTHONPATH: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "services/api[dev]"

      - name: Ruff lint
        run: ruff check services/api infra db/migrations

      - name: Black format check
        run: black --check services/api infra db/migrations

      - name: Mypy typecheck
        run: mypy services/api/app

      - name: Run Alembic migrations
        run: alembic -c db/alembic.ini upgrade head

      - name: Run pytest
        run: pytest services/api/tests

  web:
    name: Web (Lint, Format, Typecheck, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Web unit tests
        run: npm run test:unit

      - name: Next.js production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_NEON_REALTIME_URL: https://example.realtime.us-east-2.aws.neon.tech
          NEON_AUTH_BASE_URL: https://ep-example.neonauth.us-east-2.aws.neon.tech/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-dummy-neon-auth-cookie-secret-at-least-32-chars
        run: npm run build
