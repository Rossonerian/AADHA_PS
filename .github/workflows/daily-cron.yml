name: Daily Cron Fallback

on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_dispatch:

jobs:
  daily-job:
    name: Run daily market and scoring job
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      PYTHONPATH: services/api
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MARKET_DATA_DIR: data/seed/market
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e services/api

      - name: Run daily_job.py
        run: python infra/scripts/daily_job.py
