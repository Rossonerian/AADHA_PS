  level: 1
  skill_area: judging_info
  difficulty: 2
  text: Why is 'act within the next 10 minutes before upper circuit!' a red flag?
  options:
  - Artificial urgency pressures people to skip basic verification
  - Upper circuits are announced 10 minutes in advance
  - SEBI mandates 10-minute decision windows
  - It proves insider audit approval
  answer: Artificial urgency pressures people to skip basic verification
  explanation: Scammers and pump-and-dump operators use urgency to discourage independent
    due diligence.
  tags:
  - judging_info
  - red_flag
  data_origin: synthetic
