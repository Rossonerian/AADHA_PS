questions:
- id: q_l1_basics_01
  level: 1
  skill_area: basics
  difficulty: 1
  text: What is the primary regulator of India's securities and stock markets?
  options:
  - SEBI
  - RBI
  - IRDAI
  - TRAI
  answer: SEBI
  explanation: The Securities and Exchange Board of India (SEBI) regulates Indian
    capital markets and protects investors.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_02
  level: 1
  skill_area: basics
  difficulty: 1
  text: What does a Demat account hold for an Indian equity investor?
  options:
  - Shares in electronic form
  - Physical gold coins
  - Fixed deposit receipts only
  - Cash savings balance
  answer: Shares in electronic form
  explanation: A Demat (dematerialised) account with NSDL or CDSL stores securities
    electronically.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_03
  level: 1
  skill_area: basics
  difficulty: 2
  text: Which index tracks 50 large, liquid Indian companies listed on the NSE?
  options:
  - NIFTY 50
  - SENSEX 30
  - India VIX
  - NIFTY Smallcap 250
  answer: NIFTY 50
  explanation: NIFTY 50 represents the weighted average of 50 major Indian companies
    listed on the National Stock Exchange.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_04
  level: 1
  skill_area: basics
  difficulty: 2
  text: Under India's T+1 equity settlement cycle, when are shares credited after
    a Monday trade (assuming Tuesday is a working day)?
  options:
  - Tuesday
  - Wednesday
  - Friday
  - The same minute as order placement
  answer: Tuesday
  explanation: T+1 settlement completes transfer of funds and securities on the next
    business day after the trade date.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_05
  level: 1
  skill_area: basics
  difficulty: 2
  text: What does owning 1 equity share of a listed company represent?
  options:
  - Fractional ownership in the business
  - A guaranteed fixed interest loan
  - A government-backed deposit
  - A right to fixed monthly salary
  answer: Fractional ownership in the business
  explanation: Equity shares represent proportional ownership in a company's net assets
    and residual earnings.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_06
  level: 1
  skill_area: basics
  difficulty: 3
  text: What is the difference between a market order and a limit order?
  options:
  - A limit order sets the maximum buy or minimum sell price; a market order executes
    at the best available price
  - A market order can only be placed after 3:30 PM
  - A limit order guarantees immediate execution at any price
  - There is no difference on NSE
  answer: A limit order sets the maximum buy or minimum sell price; a market order
    executes at the best available price
  explanation: Limit orders protect price certainty, whereas market orders prioritize
    immediate execution.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_07
  level: 1
  skill_area: basics
  difficulty: 3
  text: How is a company's market capitalisation calculated?
  options:
  - Share price multiplied by total outstanding shares
  - Total revenue multiplied by profit margin
  - Total debt minus cash
  - Annual dividend multiplied by 10
  answer: Share price multiplied by total outstanding shares
  explanation: Market cap equals current share price times total number of issued
    equity shares.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_08
  level: 1
  skill_area: basics
  difficulty: 3
  text: What is an Initial Public Offering (IPO)?
  options:
  - The first time a private company offers shares to the public on a stock exchange
  - A company's annual dividend announcement
  - A SEBI penalty notice
  - A stock split by a listed firm
  answer: The first time a private company offers shares to the public on a stock
    exchange
  explanation: An IPO transitions a company from private ownership to public exchange
    listing.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_09
  level: 1
  skill_area: basics
  difficulty: 4
  text: After a 1:2 stock split (1 share split into 2), what happens to an investor's
    total holding value immediately, all else equal?
  options:
  - 'It stays the same: share count doubles and price halves'
  - It doubles automatically
  - It drops by 50%
  - The company's profit doubles
  answer: 'It stays the same: share count doubles and price halves'
  explanation: A stock split changes share count and per-share price proportionally
    without altering business value.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_basics_10
  level: 1
  skill_area: basics
  difficulty: 4
  text: What does the bid-ask spread in an exchange order book measure?
  options:
  - The gap between the highest buyer bid and lowest seller ask price
  - The annual dividend yield
  - The broker's annual maintenance fee
  - The gap between NSE and BSE closing times
  answer: The gap between the highest buyer bid and lowest seller ask price
  explanation: Wider bid-ask spreads indicate lower liquidity and higher implicit
    transaction cost.
  tags:
  - basics
  data_origin: synthetic
- id: q_l1_reading_stock_01
  level: 1
  skill_area: reading_stock
  difficulty: 1
  text: Which financial statement shows a company's revenue and net profit over a
    quarter or year?
  options:
  - Income Statement (Profit & Loss)
  - Balance Sheet
  - Shareholding Pattern
  - Auditor Appointment Notice
  answer: Income Statement (Profit & Loss)
  explanation: The P&L statement reports revenues, expenses, and net profit over a
    reporting period.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_02
  level: 1
  skill_area: reading_stock
  difficulty: 1
  text: Which statement gives a snapshot of a company's assets, liabilities, and equity
    on a specific date?
  options:
  - Balance Sheet
  - Cash Flow Statement
  - Income Statement
  - Press Release
  answer: Balance Sheet
  explanation: A Balance Sheet records what a company owns (assets) and owes (liabilities)
    at a point in time.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_03
  level: 1
  skill_area: reading_stock
  difficulty: 2
  text: What does Earnings Per Share (EPS) measure?
  options:
  - Net profit attributable to equity shareholders divided by total shares
  - Total sales divided by employees
  - Cash balance divided by debt
  - Share price divided by 100
  answer: Net profit attributable to equity shareholders divided by total shares
  explanation: EPS expresses how much net profit corresponds to each outstanding equity
    share.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_04
  level: 1
  skill_area: reading_stock
  difficulty: 2
  text: How is the Price-to-Earnings (P/E) ratio computed?
  options:
  - Market price per share divided by Earnings Per Share
  - Revenue divided by total assets
  - Debt divided by equity
  - Dividend divided by share price
  answer: Market price per share divided by Earnings Per Share
  explanation: P/E shows how many rupees of market price investors currently pay per
    rupee of annual earnings.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_05
  level: 1
  skill_area: reading_stock
  difficulty: 2
  text: What does a rising trading volume during a price move indicate?
  options:
  - More shares changed hands, reflecting broader market participation
  - The company issued new bonus shares
  - The exchange halted trading
  - Profit margins doubled
  answer: More shares changed hands, reflecting broader market participation
  explanation: Volume counts total shares traded during a session and helps contextualize
    price moves.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_06
  level: 1
  skill_area: reading_stock
  difficulty: 3
  text: Why is Operating Cash Flow (OCF) checked alongside Net Profit?
  options:
  - Accounting profit can rise on credit sales while actual cash collected lags
  - OCF is always identical to net profit
  - OCF ignores customer payments
  - OCF only applies to banks
  answer: Accounting profit can rise on credit sales while actual cash collected lags
  explanation: Comparing OCF to net profit verifies whether reported earnings are
    turning into real cash.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_07
  level: 1
  skill_area: reading_stock
  difficulty: 3
  text: What does a high Debt-to-Equity ratio generally signal about a non-financial
    company?
  options:
  - Greater reliance on borrowed funds relative to shareholder equity
  - Zero interest expenses
  - Guaranteed high profitability
  - Higher promoter shareholding
  answer: Greater reliance on borrowed funds relative to shareholder equity
  explanation: Higher leverage increases fixed interest obligations, which can strain
    cash flows in downturns.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_08
  level: 1
  skill_area: reading_stock
  difficulty: 3
  text: What is Return on Equity (ROE)?
  options:
  - Net profit expressed as a percentage of shareholders' equity
  - Revenue divided by market cap
  - Share price growth over 1 week
  - Total debt divided by cash
  answer: Net profit expressed as a percentage of shareholders' equity
  explanation: ROE indicates how efficiently a company generates net profit from shareholders'
    capital.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_09
  level: 1
  skill_area: reading_stock
  difficulty: 4
  text: What does promoter share pledging mean in Indian listed companies?
  options:
  - Promoters have used their shares as collateral to borrow money
  - Promoters donated shares to charity
  - The company bought back shares
  - SEBI froze the stock permanently
  answer: Promoters have used their shares as collateral to borrow money
  explanation: High promoter pledging creates forced-selling risk if the share price
    falls below lender margins.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_reading_stock_10
  level: 1
  skill_area: reading_stock
  difficulty: 4
  text: Why can a low P/E ratio sometimes be misleading ('value trap')?
  options:
  - Earnings may be cyclically peaking or about to fall sharply
  - Low P/E always means the company is debt-free
  - Low P/E guarantees fast revenue growth
  - P/E is unaffected by one-time gains
  answer: Earnings may be cyclically peaking or about to fall sharply
  explanation: Trailing P/E looks backward; temporary or declining earnings can make
    a stock appear optically cheap.
  tags:
  - reading_stock
  data_origin: synthetic
- id: q_l1_judging_info_01
  level: 1
  skill_area: judging_info
  difficulty: 1
  text: A Telegram channel promises '100% guaranteed 40% returns in 15 days'. What
    is this?
  options:
  - A classic red flag — equity market returns cannot be guaranteed
  - A standard SEBI-approved scheme
  - A normal mutual fund disclosure
  - An NSE exchange announcement
  answer: A classic red flag — equity market returns cannot be guaranteed
  explanation: Equity investments carry market risk; any promise of guaranteed high
    returns is a major red flag.
  tags:
  - judging_info
  - red_flag
  data_origin: synthetic
