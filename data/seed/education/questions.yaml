- id: q_l1_risk_05
  level: 1
  skill_area: risk
  difficulty: 2
  text: Why does borrowing money (margin/leverage) amplify risk?
  options:
  - Losses are magnified on your own capital and can trigger forced margin calls
  - Margin loans have zero interest
  - Leverage only magnifies gains, not losses
  - Brokers absorb all downside losses
  answer: Losses are magnified on your own capital and can trigger forced margin calls
  explanation: Leverage magnifies both upside and downside, risking rapid capital
    wipeout.
  tags:
  - risk
  data_origin: synthetic
