- id: q_l1_risk_01
  level: 1
  skill_area: risk
  difficulty: 1
  text: Why do investors diversify across multiple sectors instead of putting 100%
    into one stock?
  options:
  - To reduce the impact of a single company-specific shock on the entire portfolio
  - To guarantee zero losses in market crashes
  - To avoid paying any taxes
  - Because exchanges forbid owning one stock
  answer: To reduce the impact of a single company-specific shock on the entire portfolio
  explanation: Diversification reduces unsystematic (company-specific) risk, though
    market-wide risk remains.
  tags:
  - risk
  data_origin: synthetic
- id: q_l1_risk_02
  level: 1
  skill_area: risk
  difficulty: 1
  text: If a stock falls by 50% (from Rs 100 to Rs 50), what percentage gain is needed
    to return to Rs 100?
  options:
  - 100%
  - 50%
  - 75%
  - 25%
  answer: 100%
  explanation: Loss asymmetry means a 50% drawdown requires a 100% gain just to break
    even.
  tags:
  - risk
  data_origin: synthetic
- id: q_l1_risk_03
  level: 1
  skill_area: risk
  difficulty: 2
  text: What is an emergency fund's role before investing in volatile equities?
