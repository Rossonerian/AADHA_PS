  level: 1
  skill_area: judging_info
  difficulty: 2
  text: What is a 'screenshot bias' (cherry-picking) in social media stock tips?
  options:
  - Showing only winning trades while hiding or deleting losing calls
  - Using dark mode charts
  - Posting official annual reports
  - Comparing returns against NIFTY 50
  answer: Showing only winning trades while hiding or deleting losing calls
  explanation: Selective posting creates an illusion of high accuracy unless every
    call is logged transparently.
