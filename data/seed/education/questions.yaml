  level: 1
  skill_area: risk
  difficulty: 2
  text: What does a 'circuit breaker' (upper/lower price band like 5% or 20%) on NSE/BSE
    do?
  options:
  - Limits how much a stock's price can move in a single day, halting orders beyond
    the band
  - Guarantees buyers will always exist at the lower band
  - Doubles daily trading hours
  - Eliminates company bankruptcy risk
  answer: Limits how much a stock's price can move in a single day, halting orders
    beyond the band
  explanation: Lower circuits can trap holders with no buyers, creating severe liquidity
    risk.
