  level: 1
  skill_area: judging_info
  difficulty: 1
  text: Where should you verify a company's official quarterly results or board decisions
    in India?
  options:
  - Official NSE/BSE corporate filings
  - Anonymous WhatsApp forwards
  - Unverified social media reels
  - Paid tipster SMS messages
  answer: Official NSE/BSE corporate filings
  explanation: Listed companies are legally required to publish material disclosures
    on NSE and BSE.
  tags:
  - judging_info
  data_origin: synthetic
- id: q_l1_judging_info_03
  level: 1
  skill_area: judging_info
  difficulty: 2
  text: What does a SEBI registration number starting with 'INH' indicate?
  options:
  - SEBI-registered Research Analyst (RA)
  - NSE trading holiday
  - Income tax refund code
  - Unregistered social media creator
  answer: SEBI-registered Research Analyst (RA)
