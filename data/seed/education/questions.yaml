  level: 2
  skill_area: basics
  difficulty: 3
  text: What is equity dilution?
  options:
  - Issuing new shares reduces existing shareholders' percentage ownership unless
    they participate
  - Paying a cash dividend
  - Splitting 1 share into 5 shares
  - Repaying bank loans
