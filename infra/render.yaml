services:
  - type: web
    name: paisaproof-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    # Runs before each deploy goes live (paid plans only); failure aborts the deploy.
    preDeployCommand: alembic -c /app/db/alembic.ini upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-4-hydrogen
      - key: WEB_SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      - key: TIP_QUALITY_WEIGHT
        value: "0"
      - key: FINNHUB_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: EDU_PASS_ACCURACY
        value: "0.70"
      - key: EDU_MAX_BRIER
        value: "0.25"
      - key: MARKET_DATA_DIR
        value: data/seed/market
      - key: MARKET_DATA_MAX_STALE_DAYS
        value: "5"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_USER_PER_WINDOW
        value: "20"
      - key: RATE_LIMIT_IP_PER_WINDOW
        value: "60"
      - key: MAX_REQUEST_BODY_BYTES
        value: "1048576"
      - key: MAX_VERIFY_BODY_BYTES
        value: "10485760"

  - type: cron
    name: paisaproof-daily-cron
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    schedule: "0 13 * * 1-5"
    dockerCommand: "python /app/infra/scripts/daily_job.py"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MARKET_DATA_DIR
        value: data/seed/market
