services:
  - type: web
    name: paisaproof-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.1.0
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MARKET_DATA_DIR
        value: data/seed/market

  - type: cron
    name: paisaproof-daily-cron
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    schedule: "0 13 * * 1-5"
    dockerCommand: "python /app/infra/scripts/daily_job.py"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MARKET_DATA_DIR
        value: data/seed/market
